# PHPue nginx config (Docker: php:8.2-fpm service named "php", www mounted at /var/www/html)
server {
    listen 80;
    server_name localhost;

    root /var/www/html;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.pvue$ { deny all; return 404; }
    location ~ /\.dist/ { deny all; return 404; }
    location ~ ^/(views|components|backend|httpReqs|pages|ajax)/ { deny all; return 404; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # DEV ONLY: always enable hot reload. Remove in production.
        fastcgi_param QUERY_STRING $query_string&live=1;
    }

    location ~ /\.ht { deny all; }
}
